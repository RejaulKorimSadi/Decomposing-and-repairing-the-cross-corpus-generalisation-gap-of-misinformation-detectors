<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 482" width="1200" height="482" role="img" aria-labelledby="t d">
<title id="t">Where the lost macro-F1 goes, and what repairs it</title>
<desc id="d">Animated chart. The macro-F1 a detector loses on a new corpus splits into 70% ranking deficit and 30% operating-point loss. Of the operating-point loss, EM prior adaptation recovers −64%, flagging half of the items 80%, rate transfer 81% and the known target base rate 86%.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1b2e"/><stop offset="1" stop-color="#172840"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" x2="1">
    <stop offset="0" stop-color="#3987e5"/><stop offset="0.55" stop-color="#1baf7a"/><stop offset="1" stop-color="#eb6834"/>
  </linearGradient>
</defs>
<style>text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.gA{transform-box:fill-box;transform-origin:left;animation:gA 14s cubic-bezier(.3,.7,.2,1) infinite both}@keyframes gA{0%{transform:scaleX(0)}1.43%{transform:scaleX(0)}8.57%{transform:scaleX(1)}96.43%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}.lA{animation:lA 14s ease-out infinite both}@keyframes lA{0%{opacity:0}3.57%{opacity:0}7.86%{opacity:1}96.43%{opacity:1}100%{opacity:0}}.gR{transform-box:fill-box;transform-origin:left;animation:gR 14s cubic-bezier(.3,.7,.2,1) infinite both}@keyframes gR{0%{transform:scaleX(0)}11.43%{transform:scaleX(0)}17.86%{transform:scaleX(1)}96.43%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}.gO{transform-box:fill-box;transform-origin:left;animation:gO 14s cubic-bezier(.3,.7,.2,1) infinite both}@keyframes gO{0%{transform:scaleX(0)}16.43%{transform:scaleX(0)}21.43%{transform:scaleX(1)}96.43%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}.lR{animation:lR 14s ease-out infinite both}@keyframes lR{0%{opacity:0}15.00%{opacity:0}19.29%{opacity:1}96.43%{opacity:1}100%{opacity:0}}.lO{animation:lO 14s ease-out infinite both}@keyframes lO{0%{opacity:0}20.00%{opacity:0}24.29%{opacity:1}96.43%{opacity:1}100%{opacity:0}}.ax{animation:ax 14s ease-out infinite both}@keyframes ax{0%{opacity:0}24.29%{opacity:0}28.57%{opacity:1}96.43%{opacity:1}100%{opacity:0}}.zoom{animation:zoom 14s ease-out infinite both}@keyframes zoom{0%{opacity:0}22.86%{opacity:0}27.14%{opacity:1}96.43%{opacity:1}100%{opacity:0}}.r0{transform-box:fill-box;transform-origin:right;animation:r0 14s cubic-bezier(.3,.7,.2,1) infinite both}@keyframes r0{0%{transform:scaleX(0)}27.14%{transform:scaleX(0)}32.86%{transform:scaleX(1)}96.43%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}.v0{animation:v0 14s ease-out infinite both}@keyframes v0{0%{opacity:0}31.43%{opacity:0}35.71%{opacity:1}96.43%{opacity:1}100%{opacity:0}}.r1{transform-box:fill-box;transform-origin:left;animation:r1 14s cubic-bezier(.3,.7,.2,1) infinite both}@keyframes r1{0%{transform:scaleX(0)}30.36%{transform:scaleX(0)}36.07%{transform:scaleX(1)}96.43%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}.v1{animation:v1 14s ease-out infinite both}@keyframes v1{0%{opacity:0}34.64%{opacity:0}38.93%{opacity:1}96.43%{opacity:1}100%{opacity:0}}.r2{transform-box:fill-box;transform-origin:left;animation:r2 14s cubic-bezier(.3,.7,.2,1) infinite both}@keyframes r2{0%{transform:scaleX(0)}33.57%{transform:scaleX(0)}39.29%{transform:scaleX(1)}96.43%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}.v2{animation:v2 14s ease-out infinite both}@keyframes v2{0%{opacity:0}37.86%{opacity:0}42.14%{opacity:1}96.43%{opacity:1}100%{opacity:0}}.r3{transform-box:fill-box;transform-origin:left;animation:r3 14s cubic-bezier(.3,.7,.2,1) infinite both}@keyframes r3{0%{transform:scaleX(0)}36.79%{transform:scaleX(0)}42.50%{transform:scaleX(1)}96.43%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}.v3{animation:v3 14s ease-out infinite both}@keyframes v3{0%{opacity:0}41.07%{opacity:0}45.36%{opacity:1}96.43%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="1200" height="482" rx="20" fill="url(#bg)"/>
<text x="60" y="58" font-size="26" font-weight="800" fill="#f0efec">Where the lost macro-F1 goes</text>
<text x="60" y="86" font-size="15" fill="#8fa3bd">TF-IDF + LR, 42 train → test pairs, 5 seeds. Every number is read from the result files.</text>

<text class="lA" x="284" y="146" text-anchor="end" font-size="15" fill="#f0efec">Lost on a new corpus</text>
<rect class="gA" x="300" y="128" width="840" height="26" rx="6" fill="#4a5d7a"/>
<text class="lA" x="1140" y="122" text-anchor="end" font-size="12.5" fill="#8fa3bd">100% of the gap</text>

<text class="lR" x="284" y="204" text-anchor="end" font-size="15" fill="#f0efec">split by cause</text>
<rect class="gR" x="300" y="186" width="585.0" height="26" rx="6" fill="#3987e5"/>
<rect class="gO" x="891.0" y="186" width="249.0" height="26" rx="6" fill="#eb6834"/>
<text class="lR" x="312" y="204" font-size="15" font-weight="700" fill="#ffffff">Ranking 70%
  <tspan font-weight="400" fill="#e6efff">  no threshold can fix it</tspan></text>
<text class="lO" x="902.0" y="204" font-size="15" font-weight="700" fill="#ffffff">Threshold 30%</text>
<text class="lO" x="1140" y="234" text-anchor="end" font-size="13" fill="#eb6834">the right cut-off fixes this part ↓</text>

<g class="zoom">
  <path d="M891.0 214 L1140 214 L1140 262 L300 262 Z" fill="#eb6834" opacity=".07"/>
  <text x="60" y="282" font-size="17" font-weight="700" fill="#f0efec">Share of the threshold loss recovered</text>
</g>
<g class="ax"><line x1="300.0" y1="292" x2="300.0" y2="452" stroke="#2c3e58" stroke-width="1"/><text x="300.0" y="466" text-anchor="middle" font-size="11.5" fill="#8fa3bd">-100%</text><line x1="510.0" y1="292" x2="510.0" y2="452" stroke="#2c3e58" stroke-width="1"/><text x="510.0" y="466" text-anchor="middle" font-size="11.5" fill="#8fa3bd">-50%</text><line x1="720.0" y1="292" x2="720.0" y2="452" stroke="#2c3e58" stroke-width="1"/><text x="720.0" y="466" text-anchor="middle" font-size="11.5" fill="#8fa3bd">0%</text><line x1="930.0" y1="292" x2="930.0" y2="452" stroke="#2c3e58" stroke-width="1"/><text x="930.0" y="466" text-anchor="middle" font-size="11.5" fill="#8fa3bd">+50%</text><line x1="1140.0" y1="292" x2="1140.0" y2="452" stroke="#2c3e58" stroke-width="1"/><text x="1140.0" y="466" text-anchor="middle" font-size="11.5" fill="#8fa3bd">+100%</text><line x1="720.0" y1="292" x2="720.0" y2="452" stroke="#8fa3bd" stroke-width="1.5"/></g>
<text class="v0" x="284" y="316" text-anchor="end" font-size="15" fill="#f0efec">EM prior adaptation<tspan fill="#8fa3bd" font-size="12.5">  the textbook fix</tspan></text><rect class="r0" x="451.2" y="300" width="268.8" height="22" rx="5" fill="#e5484d"/><text class="v0" x="441.2" y="316" text-anchor="end" font-size="15" font-weight="700" fill="#e5484d">−64%</text><text class="v1" x="284" y="354" text-anchor="end" font-size="15" fill="#f0efec">Flag half of the items<tspan fill="#8fa3bd" font-size="12.5">  no labels</tspan></text><rect class="r1" x="720.0" y="338" width="336.0" height="22" rx="5" fill="#5ea4ef"/><text class="v1" x="1066.0" y="354" text-anchor="start" font-size="15" font-weight="700" fill="#5ea4ef">80%</text><text class="v2" x="284" y="392" text-anchor="end" font-size="15" fill="#f0efec">Rate transfer<tspan fill="#8fa3bd" font-size="12.5">  no labels</tspan></text><rect class="r2" x="720.0" y="376" width="340.2" height="22" rx="5" fill="#1baf7a"/><text class="v2" x="1070.2" y="392" text-anchor="start" font-size="15" font-weight="700" fill="#1baf7a">81%</text><text class="v3" x="284" y="430" text-anchor="end" font-size="15" fill="#f0efec">Known target base rate<tspan fill="#8fa3bd" font-size="12.5">  needs labels</tspan></text><rect class="r3" x="720.0" y="414" width="361.2" height="22" rx="5" fill="#8fa3bd"/><text class="v3" x="1091.2" y="430" text-anchor="start" font-size="15" font-weight="700" fill="#8fa3bd">86%</text>
</svg>