    </g>
    <text x="103" y="236" fill="#8fa3bd" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">train → test, ROC-AUC</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="340" y="112" fill="#f0efec" font-size="46" font-weight="700" letter-spacing="-0.5">fn-transfer-audit</text>
