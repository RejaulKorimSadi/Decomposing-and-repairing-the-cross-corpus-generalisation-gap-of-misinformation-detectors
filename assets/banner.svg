    <text x="340" y="170" fill="#c3c2b7" font-size="21">Mostly ranking, partly threshold:</text>
    <text x="340" y="198" fill="#c3c2b7" font-size="21">decomposing and repairing the cross-corpus gap of misinformation detectors</text>
    <text x="340" y="246" fill="#8fa3bd" font-size="15">10 corpora · 2 languages · 4 text units · 6 models · 5 seeds · label-free repairs</text>
  </g>
