      <rect x="90" y="30" width="26" height="26" rx="5" opacity=".1"/><rect x="120" y="30" width="26" height="26" rx="5" opacity=".1"/>
      <rect x="150" y="30" width="26" height="26" rx="5" opacity=".2"/><rect x="180" y="30" width="26" height="26" rx="5" opacity=".18"/>
      <rect x="0" y="60" width="26" height="26" rx="5" opacity=".56"/><rect x="30" y="60" width="26" height="26" rx="5" opacity=".06"/>
      <rect x="90" y="60" width="26" height="26" rx="5" opacity=".1"/><rect x="120" y="60" width="26" height="26" rx="5" opacity=".05"/>
