<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">fn-transfer-audit</title>
  <desc id="d">A seven by seven transfer matrix: strong cells on the diagonal, faded cells elsewhere, beside the project title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#16243a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#eb6834"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <!-- 7x7 matrix: diagonal = in-domain (bright), off-diagonal = transfer (faded); opacity ~ AUC -->
  <g transform="translate(64,46)">
    <g fill="#3987e5">
