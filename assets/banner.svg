  <text class="t1" x="430" y="122" font-size="56" font-weight="800" fill="#f0efec" letter-spacing="-1">Rank or threshold?</text>
  <text class="t2" x="432" y="166" font-size="25" fill="#c3c2b7">Why fake-news detectors fail on new corpora</text>
  <rect class="rule" x="432" y="188" width="560" height="5" rx="2.5" fill="url(#rule)"/>
  <text class="fact" style="animation:f0 16s linear 2.6s infinite both" x="430" y="242" opacity="1">70% of the lost F1 is ranking; 30% is the threshold</text><text class="fact" style="animation:f1 16s linear 2.6s infinite both" x="430" y="242" opacity="0">EM label-shift correction makes the threshold worse (−64% recovered)</text><text class="fact" style="animation:f2 16s linear 2.6s infinite both" x="430" y="242" opacity="0">Flagging at the source base rate recovers 81%, with no target labels</text><text class="fact" style="animation:f3 16s linear 2.6s infinite both" x="430" y="242" opacity="0">In-domain AUC 0.914, on a new corpus 0.567</text>
  <g class="chips" font-size="13.5" fill="#8fa3bd">
    <text x="432" y="292">10 corpora  ·  English and Bengali  ·  7 detectors + a zero-shot LLM  ·  5 seeds  ·  label-free repairs</text>
  </g>
