      <rect x="60" y="120" width="26" height="26" rx="5" opacity=".08"/><rect x="90" y="120" width="26" height="26" rx="5" opacity=".1"/>
      <rect x="150" y="120" width="26" height="26" rx="5" opacity=".04"/><rect x="180" y="120" width="26" height="26" rx="5" opacity=".04"/>
      <rect x="0" y="150" width="26" height="26" rx="5" opacity=".28"/><rect x="30" y="150" width="26" height="26" rx="5" opacity=".04"/>
